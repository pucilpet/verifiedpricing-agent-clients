name: Installed packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-packages:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install both distributions
        run: python -m pip install ./packages/verifiedpricing-client './packages/verifiedpricing-mcp[hosted]'
      - name: Verify installed packages and run fixtures
        shell: bash
        run: |
          for package in verifiedpricing-client verifiedpricing-mcp; do
            python -I - "$GITHUB_WORKSPACE/packages/$package/tests" "$package" <<'PYTEST'
          import importlib.metadata
          import pathlib
          import sys
          import unittest
          import verifiedpricing_client
          import verifiedpricing_mcp
          import mcp

          prefix = pathlib.Path(sys.prefix).resolve()
          for module in (verifiedpricing_client, verifiedpricing_mcp, mcp):
              assert pathlib.Path(module.__file__).resolve().is_relative_to(prefix)
          assert verifiedpricing_client.__version__ == "0.1.3"
          assert verifiedpricing_mcp.__version__ == "0.3.1"
          assert importlib.metadata.version("mcp") == "2.3.0"
          tests = pathlib.Path(sys.argv[1]).resolve()
          sys.path.insert(0, str(tests))
          suite = unittest.defaultTestLoader.discover(str(tests))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for name, module in tuple(sys.modules.items()):
              if name.startswith(("verifiedpricing_client", "verifiedpricing_mcp")) and getattr(module, "__file__", None):
                  assert pathlib.Path(module.__file__).resolve().is_relative_to(prefix), name
          expected = 49 if sys.argv[2] == "verifiedpricing-client" else 56
          assert result.testsRun == expected, result.testsRun
          assert not result.skipped, result.skipped
          sys.exit(not result.wasSuccessful())
          PYTEST
          done
