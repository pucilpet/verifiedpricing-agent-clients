[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiedpricing-mcp"
version = "0.1.1"
description = "Bounded local MCP stdio gateway over VerifiedPricing REST"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["verifiedpricing-client==0.1.1", "mcp==2.3.0"]

[project.scripts]
verifiedpricing-mcp = "verifiedpricing_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
